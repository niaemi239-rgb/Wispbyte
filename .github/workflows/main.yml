name: Wispbyte 自动重启
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip
          pip install seleniumbase pyvirtualdisplay requests
      - run: python -u scripts/main.py
        env:
          WISPBYTE_1: ${{ secrets.WISPBYTE_1 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
